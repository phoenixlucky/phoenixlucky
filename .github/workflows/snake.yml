name: Generate Snake Contribution Grid

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F447B5&color_dots=#F3EEFF,#E9D5FF,#D8B4FE,#F0ABFC,#F472B6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F9A8D4&color_dots=#241C3B,#3B2F63,#5B3FA0,#8B5CF6,#C4B5FD

      - uses: peaceiris/actions-gh-pages@v4
        name: Deploy to output branch
        with:
          publish_branch: output
          publish_dir: dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
